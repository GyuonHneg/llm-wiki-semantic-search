# 复制为 config.yaml 后填写。不要提交真实路径与凭证。
vault: /absolute/path/to/ObsidianVault
index: .cache/wiki.pkl

server:
  host: 0.0.0.0
  port: 19120
  # token 来自环境变量 WIKI_TOKEN，不写在这里
  # macOS: security find-generic-password -s com.example.wiki-bridge -w
  # Docker: /run/secrets/wiki_token

retrieval:
  alpha: 0.6          # 向量权重；BM25 权重 = 1 - alpha
  top_k: 5
  vector_model: BAAI/bge-m3

write_policy:
  read_only: true                     # Vault 默认只读
  writable_dirs:                      # 白名单写入目录
    - 00-Inbox/agents/<agent-name>/
